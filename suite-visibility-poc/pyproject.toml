[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "suite-visibility-poc"
version = "0.2.0"
description = "PoC local para registrar pausas e retomadas de suítes"
requires-python = ">=3.11"
dependencies = [
  "APScheduler>=3.11,<4",
  "keyring>=25,<27",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
suite-visibility = "suite_visibility.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
